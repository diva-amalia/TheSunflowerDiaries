<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Following • {{ user.display_name }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/profile.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

</head>

<body>

<main class="container">

<div class="card profile-card">

<a href="{{ url_for(
'profile.public_profile',
username=user.username
) }}"
class="back-link">

← Back to Profile

</a>

<div class="profile-section">

<h2>

Following

</h2>

{% if following %}

<div class="follow-list">

{% for followed in following %}

<div class="follow-card">

    <div class="follow-user">

        <div class="follow-avatar">

            <img
                src="{{ url_for(
                    'static',
                    filename=followed.avatar if followed.avatar else 'images/smallbee.jfif'
                ) }}"
                alt="{{ followed.username }}"
            >

        </div>

        <div class="follow-info">

            <a href="{{ url_for(
                'profile.public_profile',
                username=followed.username
            ) }}">
                @{{ followed.username }}
            </a>

            {% if followed.bio %}
                <div class="follow-bio">
                    {{ followed.bio }}
                </div>
            {% endif %}

        </div>

    </div>

</div>

{% endfor %}

</div>

{% else %}

<p class="empty-state">

Not following anyone yet 🌿

</p>

{% endif %}

</div>

</div>

</main>

</body>

</html>
